<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <!-- Phone Frame / Daylight Tactical Light Theme Background -->
  <rect width="420" height="840" rx="28" fill="#F4F6F9" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top App Bar (Light Theme + EN) -->
  <rect x="2" y="2" width="416" height="68" rx="26" fill="#FFFFFF"/>
  <text x="20" y="34" fill="#0F172A" font-family="sans-serif" font-size="19" font-weight="bold">Alarm Commander</text>
  <text x="20" y="54" fill="#D97706" font-family="monospace" font-size="10" font-weight="bold">TACTICAL WAKE-UP CONTROL</text>
  <rect x="312" y="22" width="48" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="336" y="40" fill="#78350F" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">EN</text>
  <circle cx="384" cy="36" r="14" fill="#E2E8F0"/>
  <text x="384" y="41" fill="#0F172A" font-family="sans-serif" font-size="13" text-anchor="middle">🌙</text>

  <!-- 1. Interface Language & Theme Card -->
  <rect x="16" y="84" width="388" height="162" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="32" y="108" fill="#D97706" font-family="monospace" font-size="12" font-weight="bold">🎨 INTERFACE LANGUAGE &amp; THEME</text>

  <text x="32" y="130" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold">App Theme:</text>
  <!-- Chips: Dark / Light (Selected) / System -->
  <rect x="32" y="138" width="76" height="30" rx="8" fill="#E2E8F0"/>
  <text x="70" y="158" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">Dark</text>

  <rect x="116" y="138" width="84" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="158" y="158" fill="#78350F" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ Light</text>

  <rect x="208" y="138" width="104" height="30" rx="8" fill="#E2E8F0"/>
  <text x="260" y="158" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">System (OS)</text>

  <text x="32" y="190" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold">Interface Language:</text>
  <rect x="32" y="198" width="90" height="30" rx="8" fill="#E2E8F0"/>
  <text x="77" y="218" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">Auto (OS)</text>

  <rect x="130" y="198" width="88" height="30" rx="8" fill="#E2E8F0"/>
  <text x="174" y="218" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">Русский</text>

  <rect x="226" y="198" width="94" height="30" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="273" y="218" fill="#78350F" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ English</text>

  <!-- 2. GitHub Releases Update Card -->
  <rect x="16" y="258" width="388" height="236" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="32" y="282" fill="#059669" font-family="monospace" font-size="12" font-weight="bold">🛡 GITHUB RELEASES UPDATE &amp; APK SIGNATURE</text>
  <text x="32" y="302" fill="#475569" font-family="sans-serif" font-size="11">Check for new releases on GitHub. Installing over an older</text>
  <text x="32" y="316" fill="#475569" font-family="sans-serif" font-size="11">version keeps all alarms and settings intact.</text>

  <rect x="32" y="326" width="356" height="44" rx="8" fill="#E2E8F0"/>
  <text x="44" y="344" fill="#0F172A" font-family="monospace" font-size="11" font-weight="bold">Installed version: v1.0 (code 1)</text>
  <text x="44" y="361" fill="#D97706" font-family="monospace" font-size="10">APK Certificate SHA-256: A4:8F:2C:91:7B:0E:...</text>

  <rect x="32" y="380" width="356" height="44" rx="10" fill="#D97706"/>
  <text x="210" y="407" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⬇ Check for Updates on GitHub</text>

  <rect x="32" y="434" width="356" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="210" y="460" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">↗ Open GitHub Releases Page</text>

  <!-- 3. Control QR Code Generator Card -->
  <rect x="16" y="506" width="388" height="248" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="210" y="530" fill="#D97706" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CONTROL QR CODE FOR BATHROOM / KITCHEN</text>
  <!-- Stylized QR Box -->
  <rect x="150" y="544" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <rect x="162" y="556" width="28" height="28" fill="none" stroke="#0F172A" stroke-width="4"/>
  <rect x="170" y="564" width="12" height="12" fill="#0F172A"/>
  <rect x="230" y="556" width="28" height="28" fill="none" stroke="#0F172A" stroke-width="4"/>
  <rect x="238" y="564" width="12" height="12" fill="#0F172A"/>
  <rect x="162" y="624" width="28" height="28" fill="none" stroke="#0F172A" stroke-width="4"/>
  <rect x="170" y="632" width="12" height="12" fill="#0F172A"/>
  <rect x="200" y="592" width="24" height="24" fill="#0F172A"/>
  <rect x="230" y="624" width="14" height="14" fill="#0F172A"/>
  <rect x="246" y="638" width="14" height="14" fill="#0F172A"/>

  <text x="210" y="684" fill="#0F172A" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ALARM-COMMANDER-BATHROOM-01</text>
  <rect x="32" y="698" width="356" height="40" rx="10" fill="#F4F6F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="210" y="723" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Share QR Code String for Printing</text>

  <!-- Bottom Navigation Bar (Light) -->
  <rect x="2" y="768" width="416" height="70" rx="26" fill="#FFFFFF"/>
  <text x="60" y="797" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">⏰</text>
  <text x="60" y="822" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">HQ</text>

  <text x="160" y="797" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">🛡</text>
  <text x="160" y="822" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">Guard</text>

  <text x="260" y="797" fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">📋</text>
  <text x="260" y="822" fill="#475569" font-family="sans-serif" font-size="12" text-anchor="middle">Logs</text>

  <rect x="328" y="778" width="64" height="28" rx="14" fill="#FEF3C7"/>
  <text x="360" y="797" fill="#78350F" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚙</text>
  <text x="360" y="822" fill="#78350F" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Config</text>
</svg>
