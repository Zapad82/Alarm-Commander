<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <!-- Phone Frame / Background -->
  <rect width="420" height="840" rx="28" fill="#0B0F17" stroke="#334155" stroke-width="2"/>

  <!-- Top App Bar -->
  <rect x="2" y="2" width="416" height="68" rx="26" fill="#131B26"/>
  <text x="20" y="34" fill="#F1F5F9" font-family="sans-serif" font-size="19" font-weight="bold">Alarm Commander</text>
  <text x="20" y="54" fill="#FFB300" font-family="monospace" font-size="10" font-weight="bold">ТАКТИЧЕСКИЙ КОНТРОЛЬ ПРОБУЖДЕНИЯ</text>

  <!-- Security & Power Efficiency Audit Card -->
  <rect x="16" y="84" width="388" height="398" rx="14" fill="#131B26" stroke="#00E676" stroke-width="1.2" stroke-opacity="0.55"/>
  <text x="30" y="110" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">АУДИТ БЕЗОПАСНОСТИ И ЭНЕРГОЭФФЕКТИВНОСТИ</text>
  <text x="30" y="128" fill="#94A3B8" font-family="sans-serif" font-size="12">Батарея: 86% (Зарядка) • Eco-режим: В РЕЗЕРВЕ</text>

  <!-- Check 1 -->
  <text x="30" y="156" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">✔ [POWER] Несчётный WakeLock с таймаутом 10 мин</text>
  <text x="46" y="172" fill="#94A3B8" font-family="sans-serif" font-size="11">setReferenceCounted(false) + авто-отключение через 600 сек</text>

  <!-- Check 2 -->
  <text x="30" y="200" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">✔ [POWER] Адаптивная защита при низком заряде (86%)</text>
  <text x="46" y="216" fill="#94A3B8" font-family="sans-serif" font-size="11">При ≤ 20% автоматически включается Eco-профиль</text>

  <!-- Check 3 -->
  <text x="30" y="244" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">✔ [POWER] Нулевое фоновое потребление датчиков</text>
  <text x="46" y="260" fill="#94A3B8" font-family="sans-serif" font-size="11">CameraX, NFC и Шагомер активны только в окне миссии</text>

  <!-- Check 4 -->
  <text x="30" y="288" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">✔ [SECURITY] Защита Webhook от утечек в HTTP</text>
  <text x="46" y="304" fill="#94A3B8" font-family="sans-serif" font-size="11">Разрешены только HTTPS или приватные LAN RFC-1918</text>

  <!-- Check 5 -->
  <text x="30" y="332" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">✔ [SECURITY] Фоточувствительная и акустическая защита</text>
  <text x="46" y="348" fill="#94A3B8" font-family="sans-serif" font-size="11">Пульсация 0.71 Гц (&lt; 3 Гц), приглушение звука до 25%</text>

  <!-- Check 6 -->
  <text x="30" y="376" fill="#00E676" font-family="monospace" font-size="11" font-weight="bold">✔ [SECURITY] Приватность камеры, микрофона и БД</text>
  <text x="46" y="392" fill="#94A3B8" font-family="sans-serif" font-size="11">Кадры закрываются в памяти; ротация логов Room ≤ 500</text>

  <!-- Permissions Checklist Header -->
  <rect x="16" y="494" width="388" height="62" rx="14" fill="#131B26"/>
  <text x="30" y="518" fill="#FFB300" font-family="monospace" font-size="11" font-weight="bold">ЧЕК-ЛИСТ РАЗРЕШЕНИЙ ANDROID 8–16</text>
  <text x="30" y="538" fill="#94A3B8" font-family="sans-serif" font-size="11">Без опасного SYSTEM_ALERT_WINDOW (Full-Screen Intent)</text>

  <!-- Permission Item 1 -->
  <rect x="16" y="568" width="388" height="84" rx="14" fill="#131B26" stroke="#00E676" stroke-width="1" stroke-opacity="0.45"/>
  <text x="30" y="594" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold">✔ Точные будильники (Exact Alarm)</text>
  <text x="388" y="594" fill="#00E676" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">АКТИВНО</text>
  <text x="30" y="616" fill="#94A3B8" font-family="sans-serif" font-size="11">Гарантирует пробуждение процессора ровно в T0 через</text>
  <text x="30" y="632" fill="#94A3B8" font-family="sans-serif" font-size="11">AlarmManager.setAlarmClock даже в глубоком сне Doze.</text>

  <!-- Permission Item 2 -->
  <rect x="16" y="664" width="388" height="84" rx="14" fill="#131B26" stroke="#00E676" stroke-width="1" stroke-opacity="0.45"/>
  <text x="30" y="690" fill="#F1F5F9" font-family="sans-serif" font-size="14" font-weight="bold">✔ Полноэкранный вызов (Full-Screen Intent)</text>
  <text x="388" y="690" fill="#00E676" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">АКТИВНО</text>
  <text x="30" y="712" fill="#94A3B8" font-family="sans-serif" font-size="11">Разворачивает боевой экран поверх блокировки экрана.</text>

  <!-- Bottom Navigation Bar -->
  <rect x="2" y="768" width="416" height="70" rx="26" fill="#131B26"/>
  <text x="60" y="797" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">⏰</text>
  <text x="60" y="822" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Штаб</text>

  <rect x="128" y="778" width="64" height="28" rx="14" fill="#3A2800"/>
  <text x="160" y="797" fill="#FFB300" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🛡</text>
  <text x="160" y="822" fill="#FFB300" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Защита</text>

  <text x="260" y="797" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">📋</text>
  <text x="260" y="822" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Журнал</text>

  <text x="360" y="797" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">⚙</text>
  <text x="360" y="822" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Опции</text>
</svg>
